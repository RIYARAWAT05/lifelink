<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeLink: donor dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root { --red:#b3172b; --red-dark:#8c1121; --ink:#2a1a1d; --soft:#fbeff0; --line:#ecd3d6; --ok:#1e7a46; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:#fff; line-height:1.5; }
  header { background:var(--red); color:#fff; padding:28px 20px; }
  header h1 { margin:0; font-size:1.9rem; }
  header p { margin:6px 0 0; opacity:.92; }
  header a { color:#fff; }
  main { max-width:620px; margin:0 auto; padding:24px 20px 60px; }
  h2 { font-size:1.2rem; margin:28px 0 8px; }
  label { display:block; font-size:.9rem; margin:14px 0 4px; }
  input, button { font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:6px; width:100%; height:46px; }
  button { background:var(--red); color:#fff; border-color:var(--red); cursor:pointer; font-weight:bold; margin-top:20px; }
  button:hover { background:var(--red-dark); }
  button:disabled { opacity:.6; cursor:wait; }
  button.plain { background:#fff; color:var(--red); }
  button.small { width:auto; margin:0; height:40px; }
  :focus-visible { outline:3px solid #f2a5ae; outline-offset:2px; }
  #status { margin-top:18px; padding:12px 14px; border-radius:6px; display:none; }
  #status.error { display:block; background:var(--soft); border:1px solid var(--red); }
  #status.success { display:block; background:#e8f5ee; border:1px solid var(--ok); }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .panel { border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
  .card { border:1px solid var(--line); border-left:5px solid var(--red); border-radius:6px; padding:14px 16px; margin-top:12px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .card h3 { margin:0 0 2px; font-size:1.05rem; }
  .card small { color:#6b5559; display:block; }
  .group { font-size:1.4rem; font-weight:bold; color:var(--red); }
  .urgent { color:var(--red); font-weight:bold; }
  .avail { color:var(--ok); font-weight:bold; }
  .busy { color:#8a6d00; font-weight:bold; }
  [hidden] { display:none !important; }
  nav { display:flex; flex-wrap:wrap; gap:6px 20px; margin-top:16px; }
  nav a { color:#fff; font-weight:bold; text-decoration:none; opacity:.8; padding-bottom:2px; border-bottom:2px solid transparent; }
  nav a:hover { opacity:1; border-bottom-color:rgba(255,255,255,.6); }
  nav a[aria-current] { opacity:1; border-bottom-color:#fff; }
</style>
</head>
<body>
<header>
  <h1>LifeLink</h1>
  <p>Donor dashboard.</p>
  <nav><a href="index.html">Search donors</a><a href="signup.html">Become a donor</a><a href="donor.html" aria-current="page">Donor login</a><a href="patient.html">Patient area</a></nav>
</header>
<main>

  <section id="authBox">
    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">
      <button id="authBtn" type="submit">Log in as donor</button>
    </form>
    <p><small>New donor? <a href="signup.html">Register here</a>.</small></p>
  </section>

  <section id="appBox" hidden>
    <div class="bar">
      <strong id="hello"></strong>
      <button id="logoutBtn" type="button" class="plain small">Log out</button>
    </div>

    <h2>Your availability</h2>
    <div class="panel bar">
      <span id="availText"></span>
      <button id="toggleBtn" type="button" class="small">Change</button>
    </div>

    <h2>Open requests for you</h2>
    <p><small id="matchNote"></small></p>
    <div id="open"></div>

    <h2>Requests you accepted</h2>
    <div id="mine"></div>
  </section>

  <div id="status" aria-live="polite"></div>
</main>

<script>
  // PASTE HERE: same Project URL as in index.html (https://xxxx.supabase.co, no /rest/v1/)
  const SUPABASE_URL = "https://ovhfoveurpredjzhuxde.supabase.co";
  // PASTE HERE: same publishable key as in index.html. Never use the secret key.
  const SUPABASE_KEY = "sb_publishable_1z1LYoRRWlczNX0R4LpMkA_3h190Nvx";

  const configured = !SUPABASE_URL.startsWith("PASTE") && !SUPABASE_KEY.startsWith("PASTE");
  const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  const $ = id => document.getElementById(id);
  let me = null;      // the donor's row
  let channel = null; // live updates

  function show(kind, msg) { $("status").className = msg ? kind : ""; $("status").textContent = msg || ""; }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }

  function requestCard(r, withButton) {
    const contact = (r.contact_name || r.contact_phone)
      ? `<small>Contact: ${esc(r.contact_name)} ${r.contact_phone ? "&middot; " + esc(r.contact_phone) : ""}</small>` : "";
    return `
      <div class="card">
        <div>
          <h3>${esc(r.city)} ${r.is_urgent ? '<span class="urgent">URGENT</span>' : ""}</h3>
          <small>Posted ${new Date(r.created_at).toLocaleString()}</small>
          ${contact}
        </div>
        <div class="group">${esc(r.blood_group)}</div>
        ${withButton ? `<button class="small" data-accept="${r.id}">Accept</button>` : ""}
      </div>`;
  }

  async function loadRequests() {
    // Pending requests that match this donor's blood group and city
    const open = await db.from("requests").select("*")
      .eq("status", "pending").eq("blood_group", me.blood_group).ilike("city", me.city)
      .order("is_urgent", { ascending: false }).order("created_at", { ascending: false });
    $("matchNote").textContent = "Showing pending " + me.blood_group + " requests in " + me.city + ".";
    $("open").innerHTML = open.error ? "<p>Could not load requests: " + esc(open.error.message) + "</p>"
      : open.data.length ? open.data.map(r => requestCard(r, true)).join("") : "<p>No open requests right now.</p>";

    const mine = await db.from("requests").select("*").eq("accepted_donor_id", me.id)
      .order("created_at", { ascending: false });
    $("mine").innerHTML = mine.error ? "<p>Could not load: " + esc(mine.error.message) + "</p>"
      : mine.data.length ? mine.data.map(r => requestCard(r, false)).join("") : "<p>You have not accepted any requests yet.</p>";
  }

  function paintAvailability() {
    $("availText").innerHTML = me.is_available
      ? '<span class="avail">Available now</span> to donate' : '<span class="busy">Not available</span> right now';
    $("toggleBtn").textContent = me.is_available ? "Mark as unavailable" : "Mark as available";
  }

  async function enterApp(user) {
    const { data, error } = await db.from("donors").select("*").eq("id", user.id).maybeSingle();
    if (error || !data) {
      show("error", "This account is not a donor account. Log out and use your donor email.");
      await db.auth.signOut();
      return;
    }
    me = data;
    $("authBox").hidden = true; $("appBox").hidden = false;
    $("hello").textContent = "Hello, " + me.name + " (" + me.blood_group + ", " + me.city + ")";
    paintAvailability(); show("", "");
    await loadRequests();
    // Live updates: refresh the lists whenever any request changes
    if (channel) db.removeChannel(channel);
    channel = db.channel("requests-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "requests" }, loadRequests)
      .subscribe();
  }

  $("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!db) { show("error", "Add your Supabase URL and key at the bottom of this file first."); return; }
    $("authBtn").disabled = true;
    const { data, error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (error) { show("error", "Log in failed: " + error.message); $("authBtn").disabled = false; return; }
    await enterApp(data.user);
    $("authBtn").disabled = false;
  });

  $("toggleBtn").onclick = async () => {
    const next = !me.is_available;
    const { error } = await db.from("donors").update({ is_available: next }).eq("id", me.id);
    if (error) { show("error", "Could not update: " + error.message); return; }
    me.is_available = next; paintAvailability();
    show("success", next ? "You are now shown as available." : "You are now shown as unavailable.");
  };

  $("open").addEventListener("click", async e => {
    const id = e.target.dataset.accept;
    if (!id) return;
    e.target.disabled = true;
    // Only accepts if the request is still pending, so two donors cannot both take it
    const { data, error } = await db.from("requests")
      .update({ status: "accepted", accepted_donor_id: me.id })
      .eq("id", id).eq("status", "pending").select();
    if (error) { show("error", "Could not accept: " + error.message); e.target.disabled = false; return; }
    if (!data.length) show("error", "Someone else already accepted this request.");
    else show("success", "You accepted the request. It now shows under Requests you accepted.");
    await loadRequests();
  });

  $("logoutBtn").onclick = async () => {
    if (channel) db.removeChannel(channel);
    await db.auth.signOut();
    $("appBox").hidden = true; $("authBox").hidden = false;
    show("success", "You are logged out.");
  };

  if (db) db.auth.getSession().then(({ data }) => { if (data.session) enterApp(data.session.user); });
</script>
</body>
</html>
