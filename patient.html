<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeLink: patient area</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root { --red:#b3172b; --red-dark:#8c1121; --ink:#2a1a1d; --soft:#fbeff0; --line:#ecd3d6; --ok:#1e7a46; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:#fff; line-height:1.5; }
  header { background:var(--red); color:#fff; padding:28px 20px; }
  header h1 { margin:0; font-size:1.9rem; }
  header p { margin:6px 0 0; opacity:.92; }
  header a { color:#fff; }
  main { max-width:620px; margin:0 auto; padding:24px 20px 60px; }
  label { display:block; font-size:.9rem; margin:14px 0 4px; }
  select, input, button { font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:6px; width:100%; height:46px; }
  button { background:var(--red); color:#fff; border-color:var(--red); cursor:pointer; font-weight:bold; margin-top:20px; }
  button:hover { background:var(--red-dark); }
  button:disabled { opacity:.6; cursor:wait; }
  button.plain { background:#fff; color:var(--red); }
  .tabs { display:flex; gap:10px; margin-bottom:6px; }
  .tabs button { margin-top:0; }
  .tabs button.off { background:#fff; color:var(--red); }
  :focus-visible { outline:3px solid #f2a5ae; outline-offset:2px; }
  #status { margin-top:18px; padding:12px 14px; border-radius:6px; display:none; }
  #status.error { display:block; background:var(--soft); border:1px solid var(--red); }
  #status.success { display:block; background:#e8f5ee; border:1px solid var(--ok); }
  .row { display:grid; grid-template-columns:1fr 1.4fr; gap:12px; }
  .card { border:1px solid var(--line); border-left:5px solid var(--red); border-radius:6px; padding:14px 16px; margin-top:12px; display:flex; justify-content:space-between; gap:12px; }
  .card h3 { margin:0 0 2px; font-size:1.1rem; }
  .card small { color:#6b5559; display:block; }
  .group { font-size:1.4rem; font-weight:bold; color:var(--red); }
  .avail { color:var(--ok); font-weight:bold; }
  .busy { color:#8a6d00; font-weight:bold; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .bar button { width:auto; margin:0; height:40px; }
  input[type=checkbox] { width:auto; height:auto; margin-right:8px; }
  h2 { font-size:1.2rem; margin:32px 0 8px; }
  .req { border:1px solid var(--line); border-left:5px solid var(--red); border-radius:6px; padding:14px 16px; margin-top:12px; }
  .req h3 { margin:0 0 4px; font-size:1.05rem; }
  .req small { color:#6b5559; display:block; }
  .urgent { color:var(--red); font-weight:bold; }
  button.small { width:auto; height:40px; margin-top:10px; }
  [hidden] { display:none !important; }
  @media (max-width:560px) { .row { grid-template-columns:1fr; } }
  nav { display:flex; flex-wrap:wrap; gap:6px 20px; margin-top:16px; }
  nav a { color:#fff; font-weight:bold; text-decoration:none; opacity:.8; padding-bottom:2px; border-bottom:2px solid transparent; }
  nav a:hover { opacity:1; border-bottom-color:rgba(255,255,255,.6); }
  nav a[aria-current] { opacity:1; border-bottom-color:#fff; }
</style>
</head>
<body>
<header>
  <h1>LifeLink</h1>
  <p>Patient area.</p>
  <nav><a href="index.html">Search donors</a><a href="signup.html">Become a donor</a><a href="donor.html">Donor login</a><a href="patient.html" aria-current="page">Patient area</a></nav>
</header>
<main>

  <!-- Shown when logged out -->
  <section id="authBox">
    <div class="tabs">
      <button id="tabLogin" type="button">Log in</button>
      <button id="tabSignup" type="button" class="off">Sign up</button>
    </div>

    <form id="authForm">
      <div id="nameWrap" hidden>
        <label for="name">Full name</label>
        <input id="name" type="text">
        <label for="phone">Phone</label>
        <input id="phone" type="tel">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" minlength="6" required autocomplete="current-password">
      <button id="authBtn" type="submit">Log in</button>
    </form>
  </section>

  <!-- Shown when logged in as a patient -->
  <section id="appBox" hidden>
    <div class="bar">
      <strong id="hello"></strong>
      <button id="logoutBtn" type="button" class="plain">Log out</button>
    </div>

    <form id="searchForm">
      <div class="row">
        <div>
          <label for="group">Blood group</label>
          <select id="group" required>
            <option value="">Choose</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
        </div>
        <div>
          <label for="city">City</label>
          <input id="city" type="text" placeholder="e.g. Dehradun" required>
        </div>
      </div>
      <button type="submit">Search donors</button>
    </form>
    <div id="results"></div>

    <h2>Post a blood request</h2>
    <form id="requestForm">
      <div class="row">
        <div>
          <label for="rgroup">Blood group needed</label>
          <select id="rgroup" required>
            <option value="">Choose</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
        </div>
        <div>
          <label for="rcity">City</label>
          <input id="rcity" type="text" placeholder="e.g. Dehradun" required>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="rname">Contact name</label>
          <input id="rname" type="text" required>
        </div>
        <div>
          <label for="rphone">Contact phone</label>
          <input id="rphone" type="tel" required>
        </div>
      </div>
      <label><input id="rurgent" type="checkbox">This is an emergency</label>
      <button id="rbtn" type="submit">Post request</button>
    </form>

    <h2>Your requests</h2>
    <div id="myRequests"></div>
  </section>

  <div id="status" aria-live="polite"></div>
</main>

<script>
  // PASTE HERE: same Project URL as in index.html (https://xxxx.supabase.co, no /rest/v1/)
  const SUPABASE_URL = "https://ovhfoveurpredjzhuxde.supabase.co";
  // PASTE HERE: same publishable key as in index.html. Never use the secret key.
  const SUPABASE_KEY = "sb_publishable_1z1LYoRRWlczNX0R4LpMkA_3h190Nvx";

  const configured = !SUPABASE_URL.startsWith("PASTE") && !SUPABASE_KEY.startsWith("PASTE");
  const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  const $ = id => document.getElementById(id);
  let mode = "login";

  function show(kind, msg) { $("status").className = msg ? kind : ""; $("status").textContent = msg || ""; }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }

  function setMode(m) {
    mode = m;
    $("tabLogin").classList.toggle("off", m !== "login");
    $("tabSignup").classList.toggle("off", m !== "signup");
    $("nameWrap").hidden = m !== "signup";
    $("name").required = m === "signup";
    $("authBtn").textContent = m === "signup" ? "Create patient account" : "Log in";
    $("password").autocomplete = m === "signup" ? "new-password" : "current-password";
    show("", "");
  }
  $("tabLogin").onclick = () => setMode("login");
  $("tabSignup").onclick = () => setMode("signup");

  async function enterApp(user) {
    // Only patients may use this area. Check there is a patient row for this account.
    const { data: patient } = await db.from("patients").select("name, phone").eq("id", user.id).maybeSingle();
    if (!patient) {
      show("error", "This account is not a patient account. Donors cannot use this area. Log out and use a patient email.");
      await db.auth.signOut();
      return;
    }
    $("authBox").hidden = true;
    $("appBox").hidden = false;
    $("hello").textContent = "Logged in as " + patient.name;
    startRequests(user.id, patient);
    show("", "");
  }

  $("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!db) { show("error", "Add your Supabase URL and key at the bottom of this file first."); return; }
    $("authBtn").disabled = true;
    const email = $("email").value.trim();
    const password = $("password").value;

    if (mode === "signup") {
      const { data, error } = await db.auth.signUp({ email, password });
      if (error) { show("error", "Sign-up failed: " + error.message); $("authBtn").disabled = false; return; }
      if (!data.session) {
        show("error", "Account created, but Supabase needs the email confirmed first. Turn off Confirm email in Authentication, Sign In / Providers, Email, then try a different email.");
        $("authBtn").disabled = false; return;
      }
      const { error: rowError } = await db.from("patients").insert({
        id: data.user.id, name: $("name").value.trim(), email, phone: $("phone").value.trim() || null
      });
      if (rowError) { show("error", "Account created, but saving details failed: " + rowError.message); $("authBtn").disabled = false; return; }
      await enterApp(data.user);
    } else {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) { show("error", "Log in failed: " + error.message); $("authBtn").disabled = false; return; }
      await enterApp(data.user);
    }
    $("authBtn").disabled = false;
  });

  $("logoutBtn").onclick = async () => {
    await db.auth.signOut();
    if (myChannel) { db.removeChannel(myChannel); myChannel = null; }
    $("appBox").hidden = true; $("authBox").hidden = false; $("results").innerHTML = ""; $("myRequests").innerHTML = "";
    show("success", "You are logged out.");
  };

  $("searchForm").addEventListener("submit", async e => {
    e.preventDefault();
    show("success", "Searching…");
    $("results").innerHTML = "";
    const group = $("group").value, city = $("city").value.trim();
    // Reads the full donors table: the access rules allow this for logged-in patients only.
    const { data, error } = await db.from("donors")
      .select("id, name, email, phone, blood_group, city, is_available")
      .eq("blood_group", group).ilike("city", city)
      .order("is_available", { ascending: false });
    if (error) { show("error", "Search failed: " + error.message); return; }
    if (!data.length) { show("success", "No " + group + " donors found in " + city + " yet. Try a nearby city."); return; }
    show("success", data.length + " donor" + (data.length > 1 ? "s" : "") + " found.");
    $("results").innerHTML = data.map(d => `
      <div class="card">
        <div>
          <h3>${esc(d.name)}</h3>
          <small>${esc(d.city)}</small>
          <small>${esc(d.email)}${d.phone ? " &middot; " + esc(d.phone) : ""}</small>
          <span class="${d.is_available ? "avail" : "busy"}">${d.is_available ? "Available now" : "Not available right now"}</span>
        </div>
        <div class="group">${esc(d.blood_group)}</div>
      </div>`).join("");
  });

  // ---- Blood requests ----
  let myId = null, myChannel = null;

  async function loadMyRequests() {
    const { data, error } = await db.from("requests").select("*")
      .eq("patient_id", myId).order("created_at", { ascending: false });
    if (error) { $("myRequests").innerHTML = "<p>Could not load requests: " + esc(error.message) + "</p>"; return; }
    if (!data.length) { $("myRequests").innerHTML = "<p>You have not posted any requests yet.</p>"; return; }

    // Look up the donor who accepted each request
    const ids = [...new Set(data.map(r => r.accepted_donor_id).filter(Boolean))];
    const donors = {};
    if (ids.length) {
      const d = await db.from("donors").select("id, name, email, phone").in("id", ids);
      (d.data || []).forEach(x => { donors[x.id] = x; });
    }

    $("myRequests").innerHTML = data.map(r => {
      let state = "Waiting for a donor to accept";
      if (r.status === "accepted") {
        const d = donors[r.accepted_donor_id];
        state = d ? "Accepted by " + esc(d.name) + ". Contact: " + esc(d.email) + (d.phone ? " &middot; " + esc(d.phone) : "")
                  : "Accepted by a donor";
      }
      if (r.status === "completed") state = "Completed";
      return `
        <div class="req">
          <h3>${esc(r.blood_group)} in ${esc(r.city)} ${r.is_urgent ? '<span class="urgent">URGENT</span>' : ""}</h3>
          <small>Posted ${new Date(r.created_at).toLocaleString()}</small>
          <strong>${state}</strong>
          ${r.status === "accepted" ? `<button class="small" data-done="${r.id}">Mark as completed</button>` : ""}
        </div>`;
    }).join("");
  }

  function startRequests(userId, patient) {
    myId = userId;
    $("rname").value = patient.name || "";
    $("rphone").value = patient.phone || "";
    loadMyRequests();
    if (myChannel) db.removeChannel(myChannel);
    // Live updates: the list refreshes when a donor accepts
    myChannel = db.channel("my-requests")
      .on("postgres_changes", { event: "*", schema: "public", table: "requests" }, loadMyRequests)
      .subscribe();
  }

  $("requestForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("rbtn").disabled = true;
    const { error } = await db.from("requests").insert({
      patient_id: myId,
      blood_group: $("rgroup").value,
      city: $("rcity").value.trim(),
      is_urgent: $("rurgent").checked,
      contact_name: $("rname").value.trim(),
      contact_phone: $("rphone").value.trim()
    });
    $("rbtn").disabled = false;
    if (error) { show("error", "Could not post the request: " + error.message); return; }
    show("success", "Request posted. Matching donors can now see it.");
    $("rgroup").value = ""; $("rcity").value = ""; $("rurgent").checked = false;
    loadMyRequests();
  });

  $("myRequests").addEventListener("click", async e => {
    const id = e.target.dataset.done;
    if (!id) return;
    e.target.disabled = true;
    const { data, error } = await db.from("requests")
      .update({ status: "completed" })
      .eq("id", id).eq("patient_id", myId).eq("status", "accepted").select();
    if (error) { show("error", "Could not update: " + error.message); e.target.disabled = false; return; }
    if (!data.length) show("error", "That request could not be marked as completed.");
    else show("success", "Marked as completed. Thank you, and thank your donor.");
    loadMyRequests();
  });

  // If a patient is already logged in from earlier, go straight in.
  if (db) db.auth.getSession().then(({ data }) => { if (data.session) enterApp(data.session.user); });
</script>
</body>
</html>
